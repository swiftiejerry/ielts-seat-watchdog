services:
  ielts-ocr:
    build: .
    image: ielts-ocr:latest
    container_name: ielts-ocr
    restart: unless-stopped
    ports:
      - "127.0.0.1:9898:9898"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9898/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  ielts-monitor:
    build: ./monitor
    image: ielts-monitor:latest
    container_name: ielts-monitor
    restart: unless-stopped
    volumes:
      - ./config.yml:/app/config.yml   # 由 Web 面板读写（热加载），无需手动编辑
      - monitor-data:/data                # 去重与已发现考位状态持久化
    ports:
      - "127.0.0.1:9899:9899"             # /health /status 状态查询
    depends_on:
      ielts-ocr:
        condition: service_healthy

volumes:
  monitor-data:
