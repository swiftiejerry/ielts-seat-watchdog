# ielts-seat-watchdog 配置模板
# 复制为 config.yml 后再启动：cp config.example.yml config.yml
# 日常调整无需手改本文件——启动后打开 Web 面板点选即可（保存即热加载）。

neea:
  user_id: ""          # NEEA 登录账号（邮箱或 NEEA 号）；留空则不自动重登
  password: ""         # NEEA 登录密码；仅在本机容器内存中使用，不写日志、不进推送

monitor:
  enabled: true
  product_code: "IELTSCDI"   # 机考 IELTSCDI / 纸笔 IELTSPBT（中国大陆目前仅机考）
  cities: ["440300"]         # 城市代码（面板可点选）；示例 440300=深圳 440100=广州
  dates: []                  # 具体考位日期 YYYY-MM-DD；推荐用面板的 7/14/30 天按钮生成
  date_range:
    start: ""
    end: ""
  center_keywords: []        # 考点关键字过滤（如 "深圳大学"）；空 = 全部考点
  session_keywords: []       # 场次过滤（如 "09:00" "14:00"）；空 = 全部场次
  interval_seconds: 60       # 平峰轮询间隔（秒），下限 5；surge 关闭时这就是常规档
  jitter_seconds: 30         # 平峰/夜间随机抖动（秒），模拟人工节奏
  night_pause:
    enabled: true
    from: "01:00"
    to: "07:00"
    interval_seconds: 600    # 夜间降频轮询间隔
  # 高峰窗口：NEEA 每日 10:00 / 20:00 批处理发布转考退考释放的考位。
  # 窗口内高频盯守，其余时段由 offpeak_interval_seconds 接管。按北京时间判断。
  # 优先级：surge > night > offpeak。
  surge:
    enabled: true
    windows:
      - ["09:55", "10:40"]
      - ["19:55", "20:40"]
    interval_seconds: 8      # 窗口内间隔，下限 5（worker 单轮实测中位 14s，再快只会排队）
    offpeak_interval_seconds: 300   # 非窗口期的白天间隔
    # 注意：surge 档的抖动会被自动钳到间隔的 1/4（8s → ±2s），
    # 否则 ±30s 抖动会把 8s 间隔整个吞掉。平峰/夜间仍用上面的 jitter_seconds。

push:
  provider: "pushplus"       # pushplus | serverchan | bark | wecom-hook | dingtalk | feishu | custom
  token: ""                  # 对应通道的 Token / SendKey / Webhook Key
  heartbeat_time: "09:00"    # 每日心跳推送，确认系统存活

ocr:
  url: "http://ielts-ocr:9898"   # 容器间内网地址，一般不改

scan:
  request_days: 0            # >0 时按 N 天为步长扫描未来 90 天真实考期（面板"扫描真实考期"）
